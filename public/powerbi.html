<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Governance Report</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#F3F6FA;color:#111827}
    .bar{height:56px;background:#0B1F3A;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:15px;font-weight:650;box-shadow:0 1px 2px rgba(15,23,42,.12)}

    .wrap{height:calc(100% - 56px);padding:16px;max-width:1800px;margin:0 auto}
    iframe{width:100%;height:100%;border:0;border-radius:8px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.10)}
  </style>
</head>
<body>
  <div class="bar">
    <div>Governance Report - Power BI</div>
    <a href="/">Back to DataOps demo</a>
  </div>
  <div class="wrap">
    <iframe title="Governance Report" src="https://app.powerbi.com/reportEmbed?reportId=0e376b19-db43-4f50-b715-6bc8f1e56565&autoAuth=true&ctid=2808f13e-3eee-4625-a70c-f4c8dab8aa28" allowfullscreen="true"></iframe>
  </div>
</body>
</html>
